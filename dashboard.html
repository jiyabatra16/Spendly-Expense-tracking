<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spendy Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

</head>

<body>


<header>

    <h2>💰 Spendy</h2>

    <a href="index.html">Home</a>

</header>


<main>

    <h1>Financial Dashboard</h1>


    <!-- Summary -->

    <div class="summary">

        <div class="box">

            <h3>Total Income</h3>

            <p id="income">
                ₹0
            </p>

        </div>


        <div class="box">

            <h3>Total Expense</h3>

            <p id="expense">
                ₹0
            </p>

        </div>


        <div class="box">

            <h3>Balance</h3>

            <p id="balance">
                ₹0
            </p>

        </div>

    </div>


    <!-- Add Transaction -->

    <section class="transaction">

        <h2>Add Transaction</h2>


        <label>
            Amount
        </label>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
        >


        <label>
            Type
        </label>

        <select id="type">

            <option value="income">
                Income
            </option>

            <option value="expense">
                Expense
            </option>

        </select>


        <label>
            Category
        </label>

        <select id="category">

            <option value="Food">
                🍔 Food
            </option>

            <option value="Shopping">
                🛍️ Shopping
            </option>

            <option value="Travel">
                🚗 Travel
            </option>

            <option value="Bills">
                💡 Bills
            </option>

            <option value="Entertainment">
                🎬 Entertainment
            </option>

            <option value="Other">
                📦 Other
            </option>

        </select>


        <button onclick="addTransaction()">
            Add Transaction
        </button>

    </section>


    <!-- History -->

    <section class="history">

        <h2>Transaction History</h2>

        <div id="transactionList"></div>

    </section>


</main>


<script src="script.js"></script>

</body>

</html>
