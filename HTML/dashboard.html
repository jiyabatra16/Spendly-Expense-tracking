<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Spendly Dashboard</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="../CSS/dashboard.css"
    >

</head>

<body>


<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        💰 SPENDLY
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <button id="logoutBtn">
            Logout
        </button>

    </nav>

</header>


<main class="container">


<section class="welcome">

    <div>

        <p class="eyebrow">
            PERSONAL FINANCE DASHBOARD
        </p>

        <h1>
            Welcome to Spendly 👋
        </h1>

        <p>
            Track your money and understand
            your spending.
        </p>

    </div>


    <button
        class="add-btn"
        onclick="openModal()"
    >
        + Add Transaction
    </button>

</section>


<!-- SUMMARY -->

<section class="summary">

    <div class="summary-card">

        <span>💰</span>

        <div>
            <p>Total Balance</p>

            <h2 id="balance">
                ₹0
            </h2>
        </div>

    </div>


    <div class="summary-card">

        <span>📈</span>

        <div>
            <p>Total Income</p>

            <h2 id="income">
                ₹0
            </h2>
        </div>

    </div>


    <div class="summary-card">

        <span>📉</span>

        <div>
            <p>Total Expenses</p>

            <h2 id="expense">
                ₹0
            </h2>
        </div>

    </div>


    <div class="summary-card">

        <span>🧾</span>

        <div>
            <p>Transactions</p>

            <h2 id="count">
                0
            </h2>
        </div>

    </div>

</section>


<!-- TRANSACTIONS -->

<section class="transactions">

    <div class="heading">

        <h2>
            Recent Transactions
        </h2>


        <select id="filter">

            <option value="all">
                All
            </option>

            <option value="income">
                Income
            </option>

            <option value="expense">
                Expenses
            </option>

        </select>

    </div>


    <div id="transactionList"></div>

</section>

</main>


<!-- MODAL -->

<div
    id="modal"
    class="modal"
>

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()"
        >
            ×
        </button>


        <h2>
            Add Transaction
        </h2>


        <form id="transactionForm">

            <label>
                Type
            </label>

            <select id="type">

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expense
                </option>

            </select>


            <label>
                Description
            </label>

            <input
                id="title"
                type="text"
                placeholder="Food, Salary..."
                required
            >


            <label>
                Amount
            </label>

            <input
                id="amount"
                type="number"
                min="1"
                placeholder="Enter amount"
                required
            >


            <label>
                Category
            </label>

            <select id="category">

                <option>Food</option>
                <option>Shopping</option>
                <option>Travel</option>
                <option>Bills</option>
                <option>Entertainment</option>
                <option>Salary</option>
                <option>Other</option>

            </select>


            <label>
                Date
            </label>

            <input
                id="date"
                type="date"
                required
            >


            <button
                class="save"
                type="submit"
            >
                Save Transaction
            </button>

        </form>

    </div>

</div>


<footer>
    © 2026 Spendly
</footer>


<!-- JavaScript -->
<script src="../JS/dashboard.js"></script>

</body>

</html>
